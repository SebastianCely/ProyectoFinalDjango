<form method="post">
    {% csrf_token %}

    <fieldset>
        <legend><h2>Registro de Citas</h2></legend>

        <label for="paciente">Paciente</label><br>
        <select name="paciente" required>
            <option value=""  disabled selected>Seleccione el paciente</option>
            {% for cliente in paciente %}
                <option value="{{cliente.id}}">{{cliente.primer_nombre}} {{cliente.segundo_nombre|default_if_none:''}} {{cliente.primer_apellido}} {{cliente.segundo_apellido|default_if_none:''}}
                </option>
            {% endfor %}    
        </select><br><br>

        <label for="tipo_cita">Tipo de cita</label><br>
        <select name="tipo_cita" required>
            <option value=""  disabled selected>Seleccione el tipo de cita</option>
            {% for cita in tipo_cita %}
                <option value="{{cita.id}}">{{cita.nombre}}
                </option>
            {% endfor %}    
        </select><br><br>
        
        <label for="doctor">Doctor</label><br>
        <select name="doctor" required>
            <option value=""  disabled selected>Seleccione al doctor</option>
            {% for doc in doctor %}
                <option value="{{doc.id}}">{{doc.primer_nombre}} {{doc.segundo_nombre|default_if_none:''}} {{doc.primer_apellido}} {{doc.segundo_nombre|default_if_none:''}}
                </option>
            {% endfor %}    
        </select><br><br>
        

        <!-- Fecha -->
        <label>Fecha:</label><br>
        <input type="date" name="fecha" required><br><br>

    </fieldset>

    <br>
    <input type="submit" value="Registrar Cita">
</form>
